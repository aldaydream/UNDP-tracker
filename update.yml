name: Update participants

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), off-peak minute
  workflow_dispatch:          # manual run: Actions -> Update participants -> Run workflow

permissions:
  contents: write

concurrency:
  group: update-participants
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Download list and compare
        run: python3 scripts/update.py

      - name: Commit changes
        # Commit author = repo owner, so Vercel (Hobby) accepts the deployment
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
